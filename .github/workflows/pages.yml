name: App veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  packen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app
  veroeffentlichen:
    needs: packen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      # GitHub braucht manchmal einen Moment, bis das Paket abrufbar ist – dann einmal neu versuchen
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d.outcome == 'failure'
        run: sleep 30
      - if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
